<div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
    <div>
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Qualifying Statistics</h1>
    </div>
</div>

<div class="validity-section bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        
        <div class="stats-card total-request-card bg-gradient-to-r from-blue-600 to-blue-500 rounded-xl p-5 flex items-center justify-between text-white relative overflow-hidden shadow-lg">
            <div class="relative z-10 flex items-center gap-4">
                <div class="icon-box bg-white/20 p-3 rounded-lg flex items-center justify-center w-14 h-14">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                </div>
                <div>
                    <p class="text-sm opacity-90 font-medium">Total Request</p>
                    <h3 class="text-4xl font-bold mt-1" id="val-total-request">0</h3>
                </div>
            </div>
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
        </div>

        <div class="stats-card qualified-card bg-white rounded-xl p-5 flex items-center border border-gray-100 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="icon-box bg-orange-50 p-3 rounded-lg text-orange-500 flex items-center justify-center w-14 h-14">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-orange-500" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                </div>
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-1 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-yellow-400 mr-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954-1.582 1.94 4.852C18.5 7.659 18.99 9 18.99 9a1 1 0 01-1 1H2a1 1 0 01-1-1s.49-1.341 2.096-2.407L5.036 2.74l3.954 1.582V3a1 1 0 011-1zM4 11a1 1 0 011-1h10a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2z" clip-rule="evenodd" />
                        </svg>
                        Qualified
                    </p>
                    <h3 class="text-4xl font-bold text-gray-800" id="val-qualified-percent">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-6 shadow-sm">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-center">
            
            <div class="space-y-6">
                <div class="stat-group">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-yellow-400"></span> Target Success Rate
                    </h4>
                    <div class="pl-4 grid grid-cols-[1fr_50px_45px] gap-y-1 items-baseline">
                        <span class="text-gray-700 text-sm font-medium">Success</span>
                        <span class="font-bold text-gray-800 text-right" id="val-req-true-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-req-true-count">(0)</span>

                        <span class="text-gray-700 text-sm font-medium">Fails</span>
                        <span class="font-bold text-gray-800 text-right" id="val-req-false-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-req-false-count">(0)</span>
                    </div>
                </div>

                <div class="stat-group">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-600"></span> Area Consistency
                    </h4>
                    <div class="pl-4 grid grid-cols-[1fr_50px_45px] gap-y-1 items-baseline">
                        <span class="text-gray-700 text-sm font-medium">Good</span>
                        <span class="font-bold text-gray-800 text-right" id="val-cons-true-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-cons-true-count">(0)</span>

                        <span class="text-gray-700 text-sm font-medium">Bad</span>
                        <span class="font-bold text-gray-800 text-right" id="val-cons-false-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-cons-false-count">(0)</span>
                    </div>
                </div>

                <div class="stat-group">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-slate-600"></span> Validation Furniture
                    </h4>
                    <div class="pl-4 grid grid-cols-[1fr_50px_45px] gap-y-1 items-baseline">
                        <span class="text-gray-700 text-sm font-medium">Success</span>
                        <span class="font-bold text-gray-800 text-right" id="val-valid-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-valid-count">(0)</span>

                        <span class="text-gray-700 text-sm font-medium">Fail</span>
                        <span class="font-bold text-gray-800 text-right" id="val-invalid-percent">0%</span>
                        <span class="text-gray-400 text-xs text-right" id="val-invalid-count">(0)</span>
                    </div>
                </div>
            </div>

            <div class="flex justify-center items-center h-64 relative">
                 <canvas id="validityPieChart"></canvas>
            </div>

            <div class="flex flex-col justify-center items-center lg:items-start pl-0 lg:pl-12 space-y-6">
                <div class="flex items-center gap-4">
                    <span class="w-4 h-4 rounded-full" style="background-color: #31009C;"></span>
                    <div>
                        <p class="text-gray-500 text-sm font-semibold uppercase tracking-wide">Qualified</p>
                        <h4 class="text-2xl font-bold text-gray-800" id="val-legend-qualified-percent">0%</h4>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <span class="w-4 h-4 rounded-full" style="background-color: #F53C56;"></span>
                    <div>
                        <p class="text-gray-500 text-sm font-semibold uppercase tracking-wide">Unqualified</p>
                        <h4 class="text-2xl font-bold text-gray-800" id="val-legend-unqualified-percent">0%</h4>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
