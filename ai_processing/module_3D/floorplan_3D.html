<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archi-Vision Core V6.7 - Matrix Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #09090b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f4f4f5;
            overflow: hidden;
            margin: 0;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #09090b;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            max-height: 94vh;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 50;
            display: flex;
            flex-direction: column;
        }

        .build-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .build-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
        }

        .log-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #818cf8;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            line-height: 1.6;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        textarea {
            scrollbar-width: none;
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="canvas-container" id="threeContainer"></div>

    <div class="ui-panel custom-scroll">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-indigo-600 p-2 rounded-xl"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="m21 16-4 4-4-4" />
                    <path d="M17 20V4" />
                    <path d="m3 8 4-4 4 4" />
                    <path d="M7 4v16" />
                </svg></div>
            <div>
                <h1 class="font-black italic text-lg leading-none uppercase tracking-tighter">Matrix <span
                        class="text-indigo-500 font-light not-italic">V6.7</span></h1>
                <p class="text-[8px] text-zinc-500 font-bold uppercase tracking-[0.2em]">Safe-Zone Logic Updated</p>
            </div>
        </div>

        <div class="space-y-4">
            <button id="btnBuild"
                class="build-btn w-full text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg">
                FLOORPLAN 3D
            </button>

            <div class="pt-2 border-t border-white/5">
                <a href="http://localhost:8002/module_3D_OSM/floorplan_3D_OSM.html"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg">
                    MAP OSM 3D
                </a>
            </div>


            <div class="pt-2 border-t border-white/5">
                <a href="http://localhost:8002/module_3D_OSM/floorplan_3D_OSM.html"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-lg">
                    FLOORPLAN 360
                </a>
            </div>
            
            <div>
                <label class="text-[9px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">JSON Layout
                    Data</label>
                <textarea id="jsonInput" rows="10"
                    class="w-full border border-zinc-800 rounded-xl p-3 text-[9px] font-mono text-zinc-400 focus:border-indigo-500 outline-none transition-all"
                    placeholder="Dán JSON vào đây..."></textarea>
            </div>

            <div class="bg-black/40 rounded-xl p-3 border border-white/5">
                <div class="text-[9px] font-black text-zinc-600 uppercase mb-2">Matrix Activity Log</div>
                <div id="logBox" class="log-box custom-scroll">
                    > Engine Standby.<br>
                    > Safe-Zone Entrance Logic: Active.
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const SCALE = 0.025;
        const WALL_H = 5.0;
        const WALL_THICKNESS = 0.15;

        // --- EMBEDDED BALCONY ASSET CODE ---
        const BALCONY_ASSET_CODE = `
            const materials = {};

            function createMaterials() {
                const createWoodTex = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#Cfb096'; ctx.fillRect(0,0,512,512);
                    ctx.strokeStyle = '#BE9E82'; ctx.lineWidth = 5;
                    for(let i=0; i<512; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke(); }
                    const tex = new THREE.CanvasTexture(canvas);
                    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                    return tex;
                };

                materials.wall = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
                materials.wood = new THREE.MeshStandardMaterial({ map: createWoodTex(), roughness: 0.7 });
                materials.floorTile = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.9 });
                materials.fabricCream = new THREE.MeshStandardMaterial({ color: 0xFDFBF7, roughness: 1 });
                materials.fabricAccent = new THREE.MeshStandardMaterial({ color: 0xD99475, roughness: 1 });
                materials.metalBlack = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5, roughness: 0.2 });
                materials.metalGold = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });
                materials.glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, opacity: 0.3, transparent: true, roughness: 0.1 });
                materials.leaf = new THREE.MeshStandardMaterial({ color: 0x4a6741, roughness: 0.8 });
                materials.lightBulbOff = new THREE.MeshStandardMaterial({ color: 0xffffff });
                materials.lightBulbOn = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xfff0aa, emissiveIntensity: 2 });
                materials.book1 = new THREE.MeshStandardMaterial({ color: 0x4a90e2 });
                materials.book2 = new THREE.MeshStandardMaterial({ color: 0xe67e22 });
                materials.book3 = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
            }

            // --- Helpers ---
            function createBox(w, h, d, mat, x, y, z, rx=0, ry=0, rz=0) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, rz);
                mesh.castShadow = mesh.receiveShadow = true;
                return mesh;
            }

            function createArchitecture() {
                const group = new THREE.Group();
                
                // Sàn
                const floor = createBox(12, 0.4, 16, materials.wood, 0, -0.2, 0);
                group.add(floor);

                // Lan can phía sau
                const backRailBase = createBox(12, 0.8, 0.3, materials.wall, 0, 0.4, -8.15);
                group.add(backRailBase);
                const backRailTop = createBox(12.2, 0.05, 0.1, materials.metalBlack, 0, 1.2, -8.15);
                group.add(backRailTop);
                
                // Cột lan can phía sau
                const postGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4);
                for(let x = -5.5; x <= 5.5; x += 1.5) {
                    const post = new THREE.Mesh(postGeo, materials.metalBlack);
                    post.position.set(x, 1.0, -8.15);
                    group.add(post);
                }

                // Tường đục lỗ duy nhất (Bên trái)
                const sideWallShape = new THREE.Shape();
                sideWallShape.moveTo(0, 0); sideWallShape.lineTo(16, 0); sideWallShape.lineTo(16, 8); sideWallShape.lineTo(0, 8);
                const hole = new THREE.Path();
                hole.moveTo(4, 0); hole.lineTo(4, 5); hole.absarc(6, 5, 2, Math.PI, 0, true); hole.lineTo(8, 0);
                sideWallShape.holes.push(hole);
                
                const sideWallGeo = new THREE.ExtrudeGeometry(sideWallShape, { depth: 0.4, bevelEnabled: false });
                const sideWall = new THREE.Mesh(sideWallGeo, materials.wall);
                sideWall.rotation.y = Math.PI/2;
                sideWall.position.set(-6.2, 0, 8); // Xoay 90 độ, đặt ở bên trái
                sideWall.receiveShadow = true;
                group.add(sideWall);

                // Lan can phía trước
                const railBase = createBox(12, 0.8, 0.3, materials.wall, 0, 0.4, 8.15);
                group.add(railBase);
                const railTop = createBox(12.2, 0.05, 0.1, materials.metalBlack, 0, 1.2, 8.15);
                group.add(railTop);

                // Lan can bên phải
                const rightRailBase = createBox(0.3, 0.8, 16.4, materials.wall, 6.15, 0.4, 0);
                group.add(rightRailBase);
                const rightRailTop = createBox(0.1, 0.05, 16.4, materials.metalBlack, 6.15, 1.2, 0);
                group.add(rightRailTop);

                // Cột lan can (Trước & Phải)
                for(let x = -5.5; x <= 5.5; x += 1.5) {
                    const post = new THREE.Mesh(postGeo, materials.metalBlack);
                    post.position.set(x, 1.0, 8.15);
                    group.add(post);
                }
                for(let z = -7.5; z <= 7.5; z += 1.5) {
                    const post = new THREE.Mesh(postGeo, materials.metalBlack);
                    post.position.set(6.15, 1.0, z);
                    group.add(post);
                }

                scene.add(group);
            }

            function createFurniture() {
                // Sofa
                const sofa = new THREE.Group();
                sofa.add(createBox(6, 0.4, 2, materials.wood, 0, 0.2, 0));
                sofa.add(createBox(5.8, 0.3, 1.8, materials.fabricCream, 0, 0.55, 0));
                // Pillows
                sofa.add(createBox(0.8, 0.8, 0.2, materials.fabricAccent, -2, 0.9, -0.7, -0.3, 0.2));
                sofa.add(createBox(0.8, 0.8, 0.2, materials.fabricAccent, 2, 0.9, -0.7, -0.3, -0.2));
                sofa.position.set(2, 0, -5);
                scene.add(sofa);

                // Bàn cà phê
                const table = new THREE.Group();
                table.add(createBox(1.8, 0.1, 1.8, materials.wood, 0, 0.6, 0));
                table.add(createBox(0.1, 0.6, 0.1, materials.metalBlack, 0.7, 0.3, 0.7));
                table.add(createBox(0.1, 0.6, 0.1, materials.metalBlack, -0.7, 0.3, 0.7));
                table.add(createBox(0.1, 0.6, 0.1, materials.metalBlack, 0.7, 0.3, -0.7));
                table.add(createBox(0.1, 0.6, 0.1, materials.metalBlack, -0.7, 0.3, -0.7));
                
                // Laptop trên bàn
                const laptop = new THREE.Group();
                const lpBase = createBox(0.6, 0.02, 0.4, materials.metalBlack, -0.3, 0.62, 0);
                const lpScreen = createBox(0.6, 0.02, 0.4, materials.metalBlack, -0.3, 0.82, -0.2);
                lpScreen.rotation.x = -Math.PI/2.5;
                const screenLight = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.35), new THREE.MeshBasicMaterial({color: 0x00ccff}));
                screenLight.position.set(-0.3, 0.82, -0.185); screenLight.rotation.x = -Math.PI/2.5;
                laptop.add(lpBase, lpScreen, screenLight);
                table.add(laptop);

                // Ly cà phê
                const cupGroup = new THREE.Group();
                const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.12, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
                cup.position.y = 0.66;
                const handle = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.01, 8, 16, Math.PI), new THREE.MeshStandardMaterial({color: 0xffffff}));
                handle.position.set(0.08, 0.66, 0); handle.rotation.z = -Math.PI/2;
                cupGroup.add(cup, handle);
                cupGroup.position.set(0.4, 0, 0.3);
                table.add(cupGroup);

                // Sách trên bàn
                const bookTable = createBox(0.3, 0.05, 0.4, materials.book1, 0.3, 0.63, -0.4, 0, 0.2);
                table.add(bookTable);

                table.position.set(2, 0, -1.5);
                scene.add(table);

                // Thảm
                const rugGeo = new THREE.PlaneGeometry(6, 8);
                const rug = new THREE.Mesh(rugGeo, new THREE.MeshStandardMaterial({color: 0xd7ccc8, roughness: 1}));
                rug.rotation.x = -Math.PI/2;
                rug.position.set(2, 0.01, -3);
                scene.add(rug);

                // Kệ sách gắn tường
                const shelf = new THREE.Group();
                shelf.add(createBox(3, 0.1, 0.6, materials.wood, 0, 0, 0));
                shelf.add(createBox(0.08, 0.4, 0.4, materials.book1, -0.8, 0.25, 0));
                shelf.add(createBox(0.08, 0.45, 0.4, materials.book2, -0.7, 0.27, 0));
                shelf.add(createBox(0.08, 0.38, 0.4, materials.book3, -0.6, 0.24, 0));
                shelf.rotation.y = Math.PI / 2;
                shelf.position.set(-5.9, 3.5, -5); 
                scene.add(shelf);
            }

            function createDecorations() {
                // Cây cảnh
                function createPlant(x, z, size=1) {
                    const p = new THREE.Group();
                    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4*size, 0.3*size, 0.6*size, 16), new THREE.MeshStandardMaterial({color: 0x8d6e63}));
                    pot.position.y = 0.3*size; p.add(pot);
                    for(let i=0; i<6; i++) {
                        const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4*size), materials.leaf);
                        leaf.position.set(Math.sin(i)*0.3*size, (0.8 + i*0.2)*size, Math.cos(i)*0.3*size);
                        leaf.scale.set(1-i*0.1, 1-i*0.1, 1-i*0.1);
                        p.add(leaf);
                    }
                    p.position.set(x, 0, z);
                    scene.add(p);
                }
                createPlant(-4, -6, 1.2);
                createPlant(-4, 2, 0.8);
                createPlant(5, 7, 1);

                // Đèn sàn
                const lamp = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 16), materials.metalBlack);
                const pole = createBox(0.05, 4, 0.05, materials.metalBlack, 0, 2, 0);
                const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 0.8, 16, 1, true), materials.fabricCream);
                shade.position.y = 4;
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1), materials.lightBulbOff);
                bulb.position.y = 4;
                const pLight = new THREE.PointLight(0xfff0aa, 0, 5);
                pLight.position.y = 4;
                lamp.add(base, pole, shade, bulb, pLight);
                lamp.position.set(-4, 0, -3);
                scene.add(lamp);

                // Tranh treo tường
                const painting = new THREE.Group();
                const frame = createBox(2, 2.5, 0.1, materials.wood, 0, 0, 0);
                const canvas = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.3), new THREE.MeshStandardMaterial({color: 0xf5f5f5}));
                canvas.position.z = 0.06;
                for(let i=0; i<5; i++) {
                    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.1, 16), new THREE.MeshBasicMaterial({color: Math.random() * 0xffffff}));
                    dot.position.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*2, 0.01);
                    canvas.add(dot);
                }
                painting.add(frame, canvas);
                painting.rotation.y = Math.PI / 2;
                painting.position.set(-5.9, 4.5, -2.5);
                scene.add(painting);

                // Dây đèn LED treo
                const wireCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-6, 7, -7),
                    new THREE.Vector3(0, 6, -5),
                    new THREE.Vector3(6, 7, -7)
                ]);
                const wireGeo = new THREE.TubeGeometry(wireCurve, 20, 0.02, 8, false);
                const wire = new THREE.Mesh(wireGeo, materials.metalBlack);
                scene.add(wire);

                for(let i=0; i<=1; i+=0.2) {
                    const pos = wireCurve.getPoint(i);
                    const bulbGroup = new THREE.Group();
                    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1), materials.lightBulbOff);
                    const light = new THREE.PointLight(0xffaa00, 0, 3);
                    bulbGroup.add(bulb, light);
                    bulbGroup.position.copy(pos);
                    scene.add(bulbGroup);
                }

                // Dù che nắng
                const umbrella = new THREE.Group();
                const upole = createBox(0.1, 6, 0.1, materials.metalBlack, 0, 3, 0);
                const top = new THREE.Mesh(new THREE.ConeGeometry(3, 1, 8), new THREE.MeshStandardMaterial({color: 0xffffff, side: THREE.DoubleSide}));
                top.position.y = 5.5;
                umbrella.add(upole, top);
                umbrella.position.set(-3, 0, 5);
                scene.add(umbrella);
            }

            function init() {
                createMaterials();
                createArchitecture();
                createFurniture();
                createDecorations();
            }
        `;

        // --- EMBEDDED STORAGE UNIT ASSET CODE ---
        const STORAGE_ASSET_CODE = `
            const materials = {};

            function createShojiTexture() {
                const size = 256;
                const canvas = document.createElement('canvas');
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fffff0'; ctx.fillRect(0,0,size,size);
                for(let i=0; i<300; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#f5f5dc' : '#ffffff';
                    ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
                }
                return new THREE.CanvasTexture(canvas);
            }

            function createWoodTexture() {
                const size = 512;
                const canvas = document.createElement('canvas');
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#8d6e63'; ctx.fillRect(0,0,size,size);
                ctx.strokeStyle = '#795548'; ctx.lineWidth = 1;
                for(let i=0; i<40; i++) {
                    ctx.beginPath(); ctx.moveTo(Math.random()*size, 0); ctx.lineTo(Math.random()*size, size); ctx.stroke();
                }
                return new THREE.CanvasTexture(canvas);
            }

            function createMaterials() {
                const shojiTex = createShojiTexture();
                const woodTex = createWoodTexture();

                materials.woodFrame = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.4, map: woodTex });
                materials.woodLight = new THREE.MeshStandardMaterial({ color: 0xD7CCC8, roughness: 0.5 });
                materials.paper = new THREE.MeshStandardMaterial({ map: shojiTex, side: THREE.DoubleSide });
                materials.metal = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.3 });
            }

            function createBox(w, h, d, mat, x, y, z) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createStorageUnit() {
                const group = new THREE.Group();

                const cabinetW = 1.76;
                const cabinetH = 5.0; // Đã cập nhật từ 2.40 lên 5.0
                const cabinetD = 0.60;

                // Frame
                group.add(createBox(cabinetW, 0.05, cabinetD, materials.woodLight, 0, cabinetH * 0.4, -cabinetD/2));
                group.add(createBox(cabinetW, 0.05, cabinetD, materials.woodLight, 0, cabinetH, -cabinetD/2));
                group.add(createBox(cabinetW, 0.05, cabinetD, materials.woodLight, 0, 0, -cabinetD/2));
                group.add(createBox(0.05, cabinetH, cabinetD, materials.woodLight, -cabinetW/2 + 0.025, cabinetH/2, -cabinetD/2));
                group.add(createBox(0.05, cabinetH, cabinetD, materials.woodLight, cabinetW/2 - 0.025, cabinetH/2, -cabinetD/2));

                // Tracks
                const trackZ = 0;
                group.add(createBox(cabinetW, 0.12, 0.15, materials.woodFrame, 0, cabinetH - 0.06, trackZ));
                group.add(createBox(cabinetW, 0.10, 0.15, materials.woodFrame, 0, 0.05, trackZ));
                group.add(createBox(0.10, cabinetH, 0.15, materials.woodFrame, -cabinetW/2 + 0.05, cabinetH/2, trackZ));
                group.add(createBox(0.10, cabinetH, 0.15, materials.woodFrame, cabinetW/2 - 0.05, cabinetH/2, trackZ));

                // Doors
                const doorH = cabinetH - 0.2;
                const doorW = cabinetW / 2 + 0.05;

                function createDoor(width, height, x, z, isFront) {
                    const dGroup = new THREE.Group();
                    const fThick = 0.08;
                    const fDepth = 0.04;

                    dGroup.add(createBox(width, fThick, fDepth, materials.woodFrame, 0, height/2 - fThick/2, 0));
                    dGroup.add(createBox(width, fThick, fDepth, materials.woodFrame, 0, -height/2 + fThick/2, 0));
                    dGroup.add(createBox(fThick, height, fDepth, materials.woodFrame, -width/2 + fThick/2, 0, 0));
                    dGroup.add(createBox(fThick, height, fDepth, materials.woodFrame, width/2 - fThick/2, 0, 0));
                    dGroup.add(createBox(width - fThick, height - fThick, 0.01, materials.paper, 0, 0, 0));
                    dGroup.add(createBox(0.1, 0.2, 0.06, materials.metal, isFront ? width/2 - 0.15 : -width/2 + 0.15, 0, 0));

                    dGroup.position.set(x, height/2 + 0.05, z);
                    return dGroup;
                }

                group.add(createDoor(doorW, doorH, -cabinetW/4, trackZ + 0.03, true));
                group.add(createDoor(doorW, doorH, cabinetW/4, trackZ - 0.03, false));

                scene.add(group);
            }

            function init() {
                createMaterials();
                createStorageUnit();
            }
        `;

        // --- EMBEDDED BEDROOM ASSET CODE ---
        const BEDROOM_ASSET_CODE = `<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng 3D Phòng Ngủ - White Wall Version</title>
    <style>

                        .to({ y: targetRot }, 1000)
                        .easing(TWEEN.Easing.Quadratic.Out)
                        .start();

                    new TWEEN.Tween(lid.rotation)
                        .to({ x: targetRot }, 1000)
                        .easing(TWEEN.Easing.Bounce.Out)
                        .start();
                    
                    obj.userData.state = obj.userData.state === 'closed' ? 'open' : 'closed';

                if (obj.userData.type === 'faucet') {

                    if (obj.userData.state === 'off') {
                        water.visible = true;

                            water.scale.set(1, 40, 1); // Scale Y up
                            water.position.y = 3.0 - (40 * 0.02); // Adjust pos to look like falling
                            // Actually better simpler approach:
                            water.scale.y = 1;
                        }).start();
                        
                        // Simple animation simulation via scale
                        water.scale.set(1, 1, 1);
                        new TWEEN.Tween(water.scale).to({ y: 30 }, 300).easing(TWEEN.Easing.Quadratic.Out).start();
                        new TWEEN.Tween(water.position).to({ y: 3.0 - 0.75 }, 300).start();

                    } else {
                        new TWEEN.Tween(water.scale).to({ y: 0.1 }, 200).start();
                        new TWEEN.Tween(water.position).to({ y: 3.0 }, 200).onComplete(() => {
                            water.visible = false;
                        }).start();
                        obj.userData.state = 'off';
                    }
                }
            }
        });

            mirrorCamera.update(renderer, scene);
            mFace.visible = true;

        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

                                if (isBalcony || isStorageFile) {
                                    const worldRatioX = (targetRoom.width - 0.1) / assetSize.x;
                                    const worldRatioZ = (targetRoom.depth - 0.1) / assetSize.z;
                                    const isRotated90 = Math.abs(Math.sin(rotationY)) > 0.5;
                                    let sX, sZ;
                                    if (isRotated90) { sX = worldRatioZ; sZ = worldRatioX; } else { sX = worldRatioX; sZ = worldRatioZ; }
                                    roomSubGroup.scale.set(sX, 1, sZ);
                                } else {
                                    const scale = Math.min((targetRoom.width - 0.4) / assetSize.x, (targetRoom.depth - 0.4) / assetSize.z);
                                    roomSubGroup.scale.multiplyScalar(scale);
                                }

                                roomSubGroup.updateMatrixWorld(true);
                                const scaledBox = new THREE.Box3().setFromObject(roomSubGroup);
                                const offset = new THREE.Vector3();

                                const roomCenter = targetRoom.box.getCenter(new THREE.Vector3());
                                const assetCenter = scaledBox.getCenter(new THREE.Vector3());
                                const roomSize = new THREE.Vector3(); targetRoom.box.getSize(roomSize);
                                const scaledAssetSize = new THREE.Vector3(); scaledBox.getSize(scaledAssetSize);

                                offset.x = roomCenter.x - assetCenter.x;
                                offset.z = roomCenter.z - assetCenter.z;

                                // Logic đẩy sát tường
                                if (isBedOrBath || isEntrance) {
                                    const paddingX = (roomSize.x - scaledAssetSize.x) / 2;
                                    const paddingZ = (roomSize.z - scaledAssetSize.z) / 2;

                                    // Normalize rotation
                                    let r = rotationY % (Math.PI * 2);
                                    if (r < 0) r += Math.PI * 2;

                                    // Direction vector for anchoring
                                    let anchorV;
                                    if (isEntrance) {
                                        anchorV = new THREE.Vector3(0, 0, 1); // Entrance: Push "Front" (+Z) to wall
                                    } else {
                                        anchorV = new THREE.Vector3(-1, 0, -1); // Bedroom/Bath: Push "Back"
                                    }

                                    anchorV.applyAxisAngle(new THREE.Vector3(0, 1, 0), r);

                                    // Apply push
                                    if (anchorV.x < -0.5) offset.x -= paddingX;
                                    if (anchorV.x > 0.5) offset.x += paddingX;
                                    if (anchorV.z < -0.5) offset.z -= paddingZ;
                                    if (anchorV.z > 0.5) offset.z += paddingZ;
                                }

                                roomSubGroup.position.add(offset);
                                roomSubGroup.position.y = 0.01;
                                log(`> Done: ${targetRoom.name} (Height: 5.0) - Đã đẩy sát vách.`);
                            }
                        }, 100);
                    } catch (err) { log(`Execution Error: ${err.message}`, "error"); }
                });
            } catch (e) { log("Import Error: " + e.message, "error"); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnBuild = document.getElementById('btnBuild');
            const btnImportTxt = document.getElementById('btnImportTxt');
            const fileTxtMap = document.getElementById('fileTxtMap');
            
            if (btnBuild) {
                btnBuild.onclick = () => {
                    try {
                        const input = document.getElementById('jsonInput').value;
                        if (!input) return log("Vui lòng dán JSON Layout Data.", "error");
                        const data = JSON.parse(input);
                        buildHouse(data);
                    } catch (e) { 
                        log("Lỗi định dạng: " + e.message, "error"); 
                    }
                };
            }

            if (btnImportTxt && fileTxtMap) {
                btnImportTxt.onclick = () => fileTxtMap.click();
                fileTxtMap.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    executeTxtMap(await file.text(), file.name);
                    e.target.value = '';
                };
            }

            initScene();
        });
    </script>
</body>
