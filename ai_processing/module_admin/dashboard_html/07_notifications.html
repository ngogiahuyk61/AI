<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-fade-in">
    <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-gray-700">Cài đặt thông báo</h3>
        <button class="text-xs text-blue-600 hover:underline">Đánh dấu tất cả đã đọc</button>
    </div>
    
    <div class="p-4 space-y-4">
        <div class="flex items-center justify-between py-2 border-b border-gray-100">
            <div>
                <p class="font-medium text-sm text-gray-800">Thông báo qua Email</p>
                <p class="text-xs text-gray-500">Nhận báo cáo hàng tuần và hóa đơn.</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer" checked>
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
        </div>

        <div class="flex items-center justify-between py-2 border-b border-gray-100">
            <div>
                <p class="font-medium text-sm text-gray-800">Cảnh báo hệ thống</p>
                <p class="text-xs text-gray-500">Khi dự án render xong hoặc gặp lỗi.</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer" checked>
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
        </div>
    </div>
</div>


<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<div id="feedback-root" class="w-full h-full bg-white rounded-xl feedback-container"></div>

<script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Thành phần Icon SVG
    const Icon = ({ name, className }) => {
        const icons = {
            check: <path d="M20 6L9 17l-5-5" />,
            send: (
                <React.Fragment>
                    <path d="m22 2-7 20-4-9-9-4Z" />
                    <path d="M22 2 11 13" />
                </React.Fragment>
            ),
            chevronDown: <path d="m6 9 6 6 6-6" />,
            messageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />,
            star: <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        };
        return (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {icons[name]}
            </svg>
        );
    };

    const FeedbackApp = () => {
        const [activeTopicIndex, setActiveTopicIndex] = useState(0);
        const [isDropdownOpen, setIsDropdownOpen] = useState(false);
        const [feedbackData, setFeedbackData] = useState({});
        const [submitted, setSubmitted] = useState(false);
        const dropdownRef = useRef(null);

        const topics = [
            {
                id: '2d',
                title: '1/ 2D Drawing Quality',
                criteria: [
                    'Clear and easy-to-understand floor plan layout',
                    'Accurate room proportions and dimensions',
                    'Consistent symbols (doors, walls, furniture)',
                    'Sharp line work without clutter',
                    'Sufficient detailed dimension information',
                    'Accuracy when exporting drawings',
                    'Availability of manual editing options',
                    'Fast processing/rendering time',
                    'Suitability for actual construction needs'
                ]
            },
            {
                id: '3d',
                title: '2/ 3D Model Quality in OSM',
                criteria: [
                    '3D model accurately represents land shape',
                    'Reasonable building elevations and proportions',
                    'High level of architectural detail',
                    'Smooth navigation (rotate/zoom)',
                    'Positional accuracy relative to real-world maps',
                    'Detailed roof and wall textures',
                    'Fast model loading time',
                    'No browser display errors/glitches',
                    'Suitable for presentation or survey purposes'
                ]
            },
            {
                id: '360',
                title: '3/ 360° View Quality',
                criteria: [
                    'Natural and easy-to-observe 360° perspective',
                    'Sharp images without blurring',
                    'Realistic lighting and color tones',
                    'Smooth scene transitions',
                    'Convenient zoom and rotation controls',
                    'No lag or stuttering during viewing',
                    'High-resolution display quality',
                    'Immersive space experience for clients',
                    'Effective support for project presentations'
                ]
            },
            {
                id: 'cskh',
                title: '4/ Customer Support Quality',
                criteria: [
                    'Enthusiastic and helpful support staff',
                    'Fast response time',
                    'Clear and easy-to-understand explanations',
                    'Professional communication style',
                    'Focused problem-solving approach',
                    'Consistency in support speed',
                    'Availability of after-hours support',
                    'Convenient support channels (chat/email/call)',
                    'Overall satisfaction with customer service'
                ]
            },
            {
                id: 'other',
                title: '5/ Additional Support',
                criteria: [
                    'Comprehensive and easy-to-follow documentation',
                    'Useful video demos and training materials',
                    'Stable technical support infrastructure',
                    'Ease of contact during emergencies/issues',
                    'Regular feature updates',
                    'Detailed and helpful FAQ section',
                    'Real-world examples provided',
                    'User-friendly onboarding for beginners',
                    'Overall satisfaction with the service'
                ]
            }
        ];

        const ratingLevels = [
            { label: 'Excellent', value: 5, color: 'bg-green-500', hover: 'hover:bg-green-600' },
            { label: 'Good', value: 4, color: 'bg-green-400', hover: 'hover:bg-green-500' },
            { label: 'Average', value: 3, color: 'bg-yellow-400', hover: 'hover:bg-yellow-500' },
            { label: 'Poor', value: 2, color: 'bg-orange-400', hover: 'hover:bg-orange-500' },
            { label: 'Very Poor', value: 1, color: 'bg-red-500', hover: 'hover:bg-red-600' }
        ];

        useEffect(() => {
            const handleClickOutside = (event) => {
                if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                    setIsDropdownOpen(false);
                }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
        }, []);

        const handleRate = (topicId, criterion, value) => {
            setFeedbackData(prev => ({
                ...prev,
                [`${topicId}_${criterion}`]: value
            }));
        };

        if (submitted) {
            return (
                <div className="w-full h-full bg-white flex items-center justify-center p-6 fade-in min-h-[500px]">
                    <div className="max-w-md w-full text-center space-y-6">
                        <div className="w-24 h-24 bg-black rounded-full flex items-center justify-center mx-auto shadow-2xl">
                            <Icon name="check" className="text-white w-12 h-12" />
                        </div>
                        <h1 className="text-4xl font-black text-black tracking-tight uppercase">Submitted!</h1>
                        <p className="text-gray-500 text-lg font-medium">Thank you for your valuable feedback.</p>
                        <button onClick={() => setSubmitted(false)} className="w-full py-5 bg-black text-white font-black rounded-2xl hover:bg-gray-800 transition-all uppercase tracking-widest">Back to Form</button>
                    </div>
                </div>
            );
        }

        const currentTopic = topics[activeTopicIndex];

        return (
            <div className="w-full bg-white text-black pb-10">
                <main className="max-w-5xl mx-auto px-6 py-8">
                    
                    {/* Dropdown Section */}
                    <div className="relative mb-16" ref={dropdownRef}>
                        <label className="text-[10px] font-black uppercase tracking-[0.2em] text-gray-400 mb-3 block">Select Template</label>
                        <button onClick={() => setIsDropdownOpen(!isDropdownOpen)} className="flex items-center justify-between w-full md:w-[400px] px-8 py-5 bg-white border-2 border-black rounded-2xl font-black text-sm uppercase tracking-wider transition-all hover:bg-gray-50 active:scale-95 shadow-lg shadow-black/5">
                            <span className="truncate">{currentTopic.title}</span>
                            <Icon name="chevronDown" className={`w-5 h-5 transition-transform duration-500 ${isDropdownOpen ? 'rotate-180' : ''}`} />
                        </button>
                        {isDropdownOpen && (
                            <div className="absolute top-full left-0 mt-3 w-full md:w-[400px] bg-white border-2 border-black rounded-2xl shadow-2xl z-50 overflow-hidden fade-in">
                                {topics.map((topic, index) => (
                                    <button key={topic.id} onClick={() => { setActiveTopicIndex(index); setIsDropdownOpen(false); }} className={`w-full text-left px-8 py-5 text-xs font-black uppercase tracking-widest transition-all ${activeTopicIndex === index ? 'bg-black text-white' : 'hover:bg-gray-50 text-gray-500 hover:text-black'}`}>
                                        {topic.title}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Content */}
                    <div className="mb-14">
                        <h1 className="text-4xl md:text-5xl font-black mb-5 tracking-tighter uppercase leading-none">{currentTopic.title}</h1>
                        <p className="text-gray-400 text-lg md:text-xl font-medium max-w-2xl">Please rate based on your experience.</p>
                    </div>

                    {/* Header Table (Hidden on Mobile) */}
                    <div className="hidden md:grid grid-cols-12 gap-4 mb-6 px-8 py-5 bg-black text-white rounded-2xl shadow-xl">
                        <div className="col-span-5 font-black uppercase tracking-widest text-[11px] flex items-center">Evaluation Criteria</div>
                        <div className="col-span-7 grid grid-cols-5 text-center text-[10px] font-black uppercase tracking-widest">
                            {ratingLevels.map(level => (
                                <div key={level.value} className="px-1 flex flex-col justify-center">
                                    <span>{level.label}</span>
                                    <span className="opacity-50 mt-1">({level.value})</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* List */}
                    <div className="space-y-3 mb-16">
                        {currentTopic.criteria.map((criterion, idx) => (
                            <div key={idx} className="group border border-gray-100 md:border-none rounded-3xl p-6 md:p-0 md:grid md:grid-cols-12 md:gap-4 md:items-center hover:bg-gray-50 transition-all duration-300">
                                <div className="md:col-span-5 md:px-8 font-bold text-gray-800 text-lg leading-tight group-hover:text-black">{criterion}</div>
                                <div className="md:col-span-7 mt-6 md:mt-0 grid grid-cols-5 gap-2 md:gap-3 p-1">
                                    {ratingLevels.map(level => {
                                        const isSelected = feedbackData[`${currentTopic.id}_${criterion}`] === level.value;
                                        return (
                                            <button key={level.value} onClick={() => handleRate(currentTopic.id, criterion, level.value)} className={`relative h-14 flex flex-col items-center justify-center rounded-2xl transition-all duration-300 font-black ${isSelected ? `${level.color} text-white shadow-xl scale-110 z-10 border-transparent` : `bg-white border-2 border-gray-100 text-gray-300 ${level.hover} hover:text-white hover:border-transparent`}`}>
                                                <span className="md:hidden text-[9px] font-black uppercase mb-1 opacity-70">{level.label}</span>
                                                <span className="text-xl">{level.value}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Comment */}
                    <div className="mb-20">
                        <div className="flex items-center space-x-3 mb-6">
                            <div className="p-2 bg-gray-100 rounded-lg"><Icon name="messageSquare" className="w-6 h-6 text-black" /></div>
                            <h3 className="font-black uppercase text-sm tracking-[0.2em] text-gray-500">Comments</h3>
                        </div>
                        <textarea placeholder="Share your thoughts..." className="w-full min-h-[180px] p-8 bg-gray-50 border-2 border-transparent rounded-[2.5rem] focus:bg-white focus:border-black outline-none transition-all resize-none text-lg font-medium shadow-inner" onChange={(e) => handleRate(currentTopic.id, 'comment', e.target.value)} />
                    </div>

                    {/* Submit */}
                    <div className="flex justify-end pt-10 border-t-2 border-gray-100">
                        <button onClick={() => setSubmitted(true)} className="group flex items-center space-x-4 px-16 py-6 bg-black text-white font-black rounded-3xl uppercase tracking-[0.2em] shadow-xl hover:bg-gray-800 transition-all active:scale-95 hover:-translate-y-1">
                            <span className="text-sm">Submit All Feedback</span>
                            <Icon name="send" className="w-5 h-5 group-hover:translate-x-2 group-hover:-translate-y-1 transition-transform" />
                        </button>
                    </div>
                </main>
            </div>
        );
    };

    // Render React App vào div #feedback-root
    const root = ReactDOM.createRoot(document.getElementById('feedback-root'));
    root.render(<FeedbackApp />);
</script>
