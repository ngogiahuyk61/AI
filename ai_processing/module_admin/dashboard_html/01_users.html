<div class="h-full flex flex-col bg-gray-50">

    <div class="bg-white border-b border-gray-200 px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0 shadow-sm z-20">
    

        <div class="flex items-center gap-3">
            <button onclick="UsersModule.syncStaffFromERP()" 
                class="px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-blue-600 rounded-lg text-sm font-bold flex items-center gap-2 shadow-sm transition-all" 
                title="Kéo danh sách nhân viên từ ERPNext về hệ thống Dashboard">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>Sync Staff</span>
            </button>

            <button onclick="UsersModule.openDrawer()" 
                class="px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg transition-all">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>Invite Customer</span>
            </button>
        </div>
    </div>

    <div class="flex-1 relative bg-white overflow-hidden">
        
        <div id="tab-manage" class="tab-content h-full flex flex-col">
            <div class="px-4 py-2 border-b flex gap-3 bg-slate-50 items-center">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">ERP Mode:</span>
                <button onclick="document.getElementById('ifrm-users').src='http://localhost:8080/app/employee?view=List'" 
                    class="px-3 py-1 bg-white border border-gray-300 rounded text-xs font-bold hover:text-blue-600 shadow-sm flex items-center gap-2">
                    Internal Staff
                </button>
                <button onclick="document.getElementById('ifrm-users').src='http://localhost:8080/app/customer?view=List'" 
                    class="px-3 py-1 bg-white border border-gray-300 rounded text-xs font-bold hover:text-blue-600 shadow-sm flex items-center gap-2">
                    Customers
                </button>
            </div>
            <iframe id="ifrm-users" src="http://localhost:8080/app/employee?view=List" class="w-full flex-1 border-none"></iframe>
        </div>

        <div id="tab-roles" class="tab-content h-full hidden">
            <iframe src="http://localhost:8080/app/permission-manager" class="w-full h-full border-none"></iframe>
        </div>

        <div id="tab-workspace" class="tab-content h-full hidden">
            <iframe src="http://localhost:8080/app/project?view=List" class="w-full h-full border-none"></iframe>
        </div>

    </div>

    <div id="user-drawer" class="fixed inset-0 z-50 hidden">
        <div onclick="UsersModule.closeDrawer()" class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        
        <div class="absolute right-0 top-0 h-full w-[500px] bg-white shadow-2xl flex flex-col transform transition-transform duration-300 translate-x-full" id="user-drawer-content">
            
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">Invite User / Customer</h3>
                <button onclick="UsersModule.closeDrawer()" class="p-2 hover:bg-gray-200 rounded-full text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
                        <input id="inp-name" type="text" class="w-full border border-gray-300 rounded-md p-2 text-sm" placeholder="Ex: John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                        <input id="inp-email" type="email" class="w-full border border-gray-300 rounded-md p-2 text-sm" placeholder="user@company.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
                        <select id="sel-user-type" class="w-full border border-gray-300 rounded-md p-2 text-sm bg-white">
                            <option value="customer">👥 Customer</option>
                            <option value="employee">👔 Staff (Manual)</option>
                        </select>
                    </div>
                    
                    <div id="div-dob" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth <span class="text-red-500">*</span></label>
                        <input type="date" id="inp-dob" class="w-full border border-gray-300 rounded-md p-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input id="inp-phone" type="text" class="w-full border border-gray-300 rounded-md p-2 text-sm" placeholder="+84...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
                        <input id="inp-title" type="text" class="w-full border border-gray-300 rounded-md p-2 text-sm" placeholder="Ex: Manager">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="sel-status" class="w-full border border-gray-300 rounded-md p-2 text-sm bg-white">
                            <option value="active">Active</option>
                            <option value="pending" selected>Pending</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                <button onclick="UsersModule.closeDrawer()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg text-sm font-medium">Cancel</button>
                <button onclick="UsersModule.saveUser()" class="px-6 py-2 bg-slate-900 text-white hover:bg-black rounded-lg text-sm font-bold shadow-md">Invite & Sync</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Logic ẩn/hiện ngày sinh tùy theo loại tài khoản
    document.getElementById('sel-user-type').addEventListener('change', function () {
        const dobDiv = document.getElementById('div-dob');
        if (this.value === 'employee') {
            dobDiv.classList.remove('hidden');
        } else {
            dobDiv.classList.add('hidden');
        }
    });
</script>
