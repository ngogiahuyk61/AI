<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAI Enterprise - Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.3.0/styles/overlayscrollbars.min.css"
        rel="stylesheet" />
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/2.3.0/browser/overlayscrollbars.browser.es6.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 text-gray-900 h-screen overflow-hidden">

    <div id="app-loading"
        class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-500">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-500 text-sm font-medium">Đang kết nối hệ thống Clerk...</p>
    </div>

    <div id="auth-landing" class="hidden fixed inset-0 z-[90] flex items-center justify-center auth-bg">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md mx-4 text-center fade-in">
            <div
                class="w-16 h-16 bg-white border-2 border-black rounded-xl mx-auto flex items-center justify-center mb-6 shadow-lg">
                <img src="./images/logo_admin.png" alt="WebAI Admin" class="w-full h-full object-contain">
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">WebAI Admin</h1>
            <p class="text-gray-500 mb-8">Hệ thống quản trị doanh nghiệp.</p>

            <div id="env-warning"
                class="hidden mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-left shadow-sm">
                <div class="flex items-start gap-3">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-yellow-600 shrink-0 mt-0.5"></i>
                    <div>
                        <p class="text-sm text-yellow-800 font-bold mb-1">Môi trường hạn chế</p>
                        <p class="text-xs text-yellow-700" id="env-warning-text">
                            Trình duyệt đang chặn kết nối bảo mật đến Clerk.
                            <br>Hãy sử dụng <b>Chế độ Demo</b> để xem trước.
                        </p>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <!-- <button onclick="handleDemoClick()" id="btn-demo"
                    class="w-full bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-3">
                    <i data-lucide="play-circle" class="w-5 h-5 text-blue-600"></i>
                    <span>Vào Dashboard Demo</span>
                </button> -->

                <button onclick="handleSignInClick()" id="btn-login-real"
                    class="w-full bg-black text-white hover:bg-gray-800 font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3">
                    <img src="./images/logo_admin.png" alt="V&B"
                        class="h-5 grayscale brightness-200">
                    <span>Login Account</span>
                </button>
            </div>

            <div class="mt-6 text-xs text-gray-400 border-t border-gray-100 pt-4 flex justify-between">
                <span id="auth-status">Checking connection...</span>
                <!-- <a href="#" class="hover:underline hover:text-blue-500">Hướng dẫn chạy thật</a> -->
            </div>
        </div>
    </div>

    <div id="dashboard-container" class="hidden h-full flex flex-col">
        <div id="toast-container" class="fixed top-16 right-4 z-[70] flex flex-col gap-2"></div>

        <div class="flex flex-1 overflow-hidden">
            <aside id="sidebar"
                class="w-[300px] bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 shrink-0 shadow-xl z-40 relative h-full">
                <div
                    class="h-16 flex items-center px-4 border-b border-slate-800 shrink-0 bg-slate-950 text-white shadow-sm gap-2 cursor-pointer hover:bg-slate-900 transition-colors">
                    <div
                        class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white shrink-0">
                        W</div>
                    <div class="sidebar-text overflow-hidden">
                        <div class="text-sm font-bold truncate">WebAI Corp</div>
                        <div class="text-[10px] text-slate-400 truncate">Enterprise Workspace</div>
                    </div>
                </div>

                <div id="sidebar-scroll-area" class="flex-1 overflow-y-auto py-4 custom-scroll">
                    <div id="sidebar-menu" class="space-y-1"></div>
                </div>

                <div class="p-4 border-t border-slate-800 bg-slate-950 shrink-0">
                    <button onclick="handleSignOutClick()"
                        class="flex items-center gap-3 text-xs text-slate-500 hover:text-white w-full px-2 py-2 rounded transition-colors justify-center">
                        <i data-lucide="log-out" class="w-3 h-3"></i>
                        <span class="sidebar-text">Đăng xuất</span>
                    </button>
                </div>
            </aside>

            <div class="flex-1 flex flex-col min-w-0 bg-gray-50 h-full relative">
                <header
                    class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm shrink-0">
                    <div class="flex items-center gap-4">
                        <button onclick="toggleSidebar()"
                            class="p-2 hover:bg-gray-100 rounded-lg text-gray-600 transition-colors">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                        <div class="hidden sm:block">
                            <h1 id="page-title" class="text-lg font-bold text-gray-800 leading-tight">Dashboard</h1>
                            <p id="page-desc" class="text-xs text-gray-500">Loading...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="pl-2 border-l border-gray-200 flex items-center gap-3">
                            <div class="text-right hidden md:block">
                                <p class="text-sm font-bold text-gray-800" id="clerk-user-name">Guest</p>
                                <p class="text-[10px] text-purple-600 font-bold uppercase tracking-wide bg-purple-50 px-2 py-0.5 rounded text-right"
                                    id="clerk-user-role">Administrator</p>
                            </div>
                            <div id="user-button-mount" class="w-8 h-8 rounded-full bg-gray-200"></div>
                        </div>
                    </div>
                </header>

                <main id="main-scroll-area" class="flex-1 p-4 sm:p-6 overflow-y-auto relative custom-scroll">
                    <div id="module-content-area" class="max-w-7xl mx-auto h-full flex flex-col animate-fade-in"></div>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/db.js"></script>

    <script src="js/core.js"></script>
    
</body>

</html>
