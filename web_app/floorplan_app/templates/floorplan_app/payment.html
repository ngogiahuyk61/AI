<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - WebAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div
        class="bg-white w-full max-w-4xl rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-gray-100">

        <div class="w-full md:w-1/2 bg-black text-white p-8 md:p-12 flex flex-col justify-between relative">
            <div class="absolute top-0 right-0 p-4 opacity-20">
                <i data-lucide="credit-card" class="w-32 h-32"></i>
            </div>

            <div>
                <a href="/" class="text-sm text-gray-400 hover:text-white flex items-center mb-8 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Quay lại Home
                </a>
                <h2 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Đơn hàng của bạn</h2>
                <h1 id="pkg-name" class="text-4xl font-bold mb-4">Đang tải...</h1>
                <div class="flex items-baseline gap-2 mb-6">
                    <span id="pkg-price" class="text-5xl font-bold text-white">...</span>
                    <span class="text-gray-400" id="pkg-cycle">/ tháng</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex items-center gap-3 bg-gray-900 p-3 rounded-lg">
                    <div class="p-2 bg-gray-800 rounded-full"><i data-lucide="zap" class="w-5 h-5 text-yellow-400"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-400">Số lượng Tokens</p>
                        <p id="pkg-tokens" class="font-bold text-lg">...</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-gray-900 p-3 rounded-lg">
                    <div class="p-2 bg-gray-800 rounded-full"><i data-lucide="clock" class="w-5 h-5 text-blue-400"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-400">Thời hạn sử dụng</p>
                        <p id="pkg-days" class="font-bold text-lg">...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full md:w-1/2 p-8 md:p-12 bg-white">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Thanh toán Demo</h2>
                <p class="text-sm text-gray-500">Đây là bản giả lập. Không có tiền thật bị trừ.</p>
            </div>

            <form onsubmit="return false;" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chủ thẻ (Họ tên)</label>
                    <input type="text" id="user-name-input"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-black focus:border-transparent outline-none transition-all placeholder-gray-400"
                        placeholder="Đang lấy thông tin...">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số thẻ (Demo - Chỉ đọc)</label>
                    <div class="relative">
                        <input type="text" value="4242 4242 4242 4242"
                            class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 bg-gray-100 text-gray-500 cursor-not-allowed"
                            readonly>
                        <div class="absolute left-3 top-3.5 text-gray-400"><i data-lucide="credit-card"
                                class="w-5 h-5"></i></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hết hạn</label>
                        <input type="text" value="12 / 2028"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-100 text-gray-500 cursor-not-allowed"
                            readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CVC</label>
                        <input type="text" value="***"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-100 text-gray-500 cursor-not-allowed"
                            readonly>
                    </div>
                </div>

                <div class="pt-4">
                    <button id="btn-pay" onclick="processPayment()"
                        class="w-full bg-black text-white h-14 rounded-xl font-bold text-lg hover:bg-gray-800 transform hover:scale-[1.02] transition-all flex items-center justify-center gap-2 shadow-lg">
                        Xác nhận Thanh toán
                    </button>
                </div>

                <p id="error-msg" class="text-center text-sm text-red-500 hidden mt-2"></p>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- CẤU HÌNH (ĐIỀN KEY CỦA BẠN VÀO ĐÂY) ---
        const SUPABASE_URL = 'https://fexyylqfnxiyvhkyrylc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4IREqPoTacRW-Va0w9X_Kg_um-da6BH';
        const CLERK_KEY = 'pk_test_c2V0dGxpbmcta2l0dGVuLTEyLmNsZXJrLmFjY291bnRzLmRldiQ';

        // 2. CẤU HÌNH GIÁ (Phải khớp với file 02_services.js)
        const pricingConfig = {
            free: { name: 'Gói Free', monthly: 0, yearly: 0, tokens: 100 },
            pro: { name: 'Gói Pro', monthly: 29, yearly: 24, tokens: 500 }, // Yearly giảm giá
            vip: { name: 'Gói VIP', monthly: 99, yearly: 79, tokens: 3000 }
        };

        // 3. LẤY THÔNG TIN TỪ URL
        const urlParams = new URLSearchParams(window.location.search);
        const planCode = urlParams.get('plan') || 'free';
        const cycle = urlParams.get('cycle') || 'monthly'; // Mặc định monthly

        const selectedPlan = pricingConfig[planCode];

        // --- TÍNH TOÁN GIÁ & DISCOUNT ---
        let finalPrice = 0;
        let durationDays = 30;
        let discountLabel = null; // Mặc định không giảm giá
        let cycleLabel = '/ tháng';

        if (selectedPlan) {
            if (cycle === 'yearly') {
                // Logic Gói Năm
                // Giá hiển thị = Giá tháng (đã giảm) * 12 tháng
                finalPrice = selectedPlan.yearly * 12;
                durationDays = 365;
                if (planCode !== 'free') discountLabel = '20%'; // Free không có discount
                cycleLabel = '/ năm';
            } else {
                // Logic Gói Tháng
                finalPrice = selectedPlan.monthly;
                durationDays = 30;
                discountLabel = null;
                cycleLabel = '/ tháng';
            }

            // Hiển thị UI
            document.getElementById('pkg-name').innerText = selectedPlan.name + (cycle === 'yearly' ? ' (Năm)' : '');
            document.getElementById('pkg-price').innerText = '$' + finalPrice;
            document.getElementById('pkg-cycle').innerText = cycleLabel;

            document.getElementById('pkg-tokens').innerText = selectedPlan.tokens;
            document.getElementById('pkg-days').innerText = durationDays + ' Ngày';
        }

        // Biến lưu User
        let clerkUser = null;

        // --- 3. KHỞI TẠO CLERK ---
        async function initPage() {
            // Tạo thẻ script động để gắn Key TRƯỚC khi load (Fix lỗi Missing publishableKey)
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
            script.async = true;
            script.crossOrigin = "anonymous";
            script.setAttribute('data-clerk-publishable-key', CLERK_KEY);

            script.onload = async () => {
                const Clerk = window.Clerk;
                try {
                    await Clerk.load();

                    if (!Clerk.user) {
                        console.log("Chưa đăng nhập, chuyển về Home...");
                        window.location.href = '/';
                    } else {
                        clerkUser = Clerk.user;
                        console.log("User:", clerkUser.fullName);
                        // Auto-fill tên người dùng
                        document.getElementById('user-name-input').value = clerkUser.fullName || clerkUser.primaryEmailAddress?.emailAddress || "";
                    }
                } catch (err) {
                    console.error("Lỗi khởi tạo Clerk:", err);
                    document.getElementById('error-msg').innerText = "Lỗi kết nối xác thực.";
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            };
            document.body.appendChild(script);
        }

        initPage();

        // --- 4. HÀM XỬ LÝ THANH TOÁN ---
        async function processPayment() {
            const btn = document.getElementById('btn-pay');
            const errorLabel = document.getElementById('error-msg');

            // UI Loading
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang xử lý...`;

            try {
                // Giả lập delay
                await new Promise(r => setTimeout(r, 1000));

                if (!window.Clerk || !window.Clerk.session) {
                    throw new Error("Phiên đăng nhập đã hết hạn.");
                }

                // Lấy Token Supabase
                const token = await window.Clerk.session.getToken({ template: 'supabase' });

                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    global: { headers: { Authorization: `Bearer ${token}` } }
                });

                // Tính ngày hết hạn
                const startDate = new Date();
                const endDate = new Date();
                endDate.setDate(startDate.getDate() + durationDays);

                // Gửi dữ liệu vào DB (Cập nhật đầy đủ trường)
                const { error } = await client
                    .from('subscriptions')
                    .insert({
                        user_id: clerkUser.id,
                        package_code: planCode,
                        start_date: startDate.toISOString(),
                        end_date: endDate.toISOString(),
                        status: 'active',

                        // CÁC TRƯỜNG QUAN TRỌNG:
                        amount_paid: finalPrice,
                        discount: discountLabel, // '20%' hoặc null
                        tokens_used: 0,          // Reset token dùng về 0
                        payment_method: 'demo_card'
                    });

                if (error) throw error;

                // Thành công
                btn.className = "w-full bg-green-600 text-white h-14 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-2";
                btn.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> Thành công!`;
                lucide.createIcons();

                setTimeout(() => {
                    window.location.href = '/floorplan-2D/';
                }, 1000);

            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.innerText = "Thử lại";
                btn.className = "w-full bg-black text-white h-14 rounded-xl font-bold text-lg hover:bg-gray-800 flex items-center justify-center gap-2 shadow-lg";
                errorLabel.innerText = "Lỗi: " + (err.message || err.error_description || "Không thể thanh toán");
                errorLabel.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
